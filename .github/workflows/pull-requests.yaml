name: Pull Requests

# NOTE: use `pull_request`, not `pull_request_target`.
# `pull_request_target` checks out the BASE branch by default, so this job was
# building `main` on every PR instead of the contributor's code. It also runs
# with a read/write token and access to secrets, which is why it must never be
# combined with checking out PR code (the "pwn request" vulnerability).
# `pull_request` checks out the PR merge ref and hands fork PRs a read-only
# token with no secrets, which is what a build/test job wants.
on:
  pull_request:
    branches:
    - '**'
  push:
    branches:
    - 'main'
  # Run by hand from the Actions tab (or `gh workflow run pull-requests.yaml -f containers=default,DB2`),
  # to test with database containers a pull request doesn't start.
  workflow_dispatch:
    inputs:
      containers:
        description: >-
          Database containers for the Linux integration tests, comma-separated. Names: SqlServer2016, Postgres,
          MySql, Oracle, Firebird, DB2 (the keys in test/FluentMigrator.Tests/appsettings.json), plus default (the
          ones a pull request runs), all and none. "default,DB2" adds Db2; "DB2" runs Db2 alone.
        type: string
        default: default
  # Called by monthly-integration-tests.yml.
  workflow_call:
    inputs:
      containers:
        description: As for workflow_dispatch.
        type: string
        default: default

env:
  solution: 'FluentMigrator.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      issues: write
      pull-requests: write

    strategy:
      matrix:
         include:
          - os: windows-latest
            dotnet-tfm: net48
          - os: ubuntu-latest
            dotnet-tfm: net8.0

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: 6.3.x

    - name: Execute GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
      env:
        BUILD_BUILDNUMBER: ${{ env.GitVersion.NuGetVersionV2 }}
      with:
        updateAssemblyInfo: false

    - name: Setup dotnet SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'

    - name: Setup dotnet SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Setup dotnet SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Setup .NET Framework 4.8 Developer Pack (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Check registry for .NET Framework 4.8 (Release >= 528040 indicates 4.8)
        try { $reg = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -ErrorAction Stop; $release = $reg.Release } catch { $release = 0 }
        if ($release -ge 528040) {
          Write-Host ".NET Framework 4.8 or higher already installed (Release=$release). Skipping install."
          exit 0
        }
        Write-Host "No .NET Framework 4.8 Developer Pack found (Release=$release). Installing..."
        # Ensure TLS 1.2 for secure downloads
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        # Resolve the current Microsoft download link by scraping the official docs page
        $downloadPage = 'https://learn.microsoft.com/en-us/dotnet/framework/install/dotnet-48'
        Write-Host "Resolving installer URL from: $downloadPage"
        try {
          $page = (Invoke-WebRequest -Uri $downloadPage -ErrorAction Stop).Content
          if ($page -match 'https://download\.visualstudio\.microsoft\.com/[^\s"''<>]+ndp48-devpack-enu\.exe') { $link = $Matches[0] }
        } catch {
          $link = $null
        }
        if (-not $link) {
          throw "Failed to resolve download URL for ndp48-devpack-enu.exe from Microsoft documentation. Please update the workflow with a valid installer URL."
        }
        Write-Host "Resolved download URL: $link"
        $installerPath = Join-Path $env:TEMP 'ndp48-devpack-enu.exe'
        # Download with retries; prefer BITS when available
        $maxAttempts = 5
        for ($i = 1; $i -le $maxAttempts; $i++) {
          try {
            if (Get-Command Start-BitsTransfer -ErrorAction SilentlyContinue) {
              Start-BitsTransfer -Source $link -Destination $installerPath -ErrorAction Stop
            } else {
              Invoke-WebRequest -Uri $link -OutFile $installerPath -UseBasicParsing -ErrorAction Stop
            }
            break
          } catch {
            Write-Warning "Download attempt $i failed: $($_.Exception.Message)"
            if ($i -eq $maxAttempts) { throw "Failed to download .NET Framework 4.8 Developer Pack after $maxAttempts attempts." }
            Start-Sleep -Seconds (15 * $i)
          }
        }
        Write-Host "Running installer: $installerPath"
        Start-Process -FilePath $installerPath -ArgumentList '/quiet','/norestart' -Wait -ErrorAction Stop
        # Verify installation
        try { $reg = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -ErrorAction Stop; $newRelease = $reg.Release } catch { $newRelease = 0 }
        if ($newRelease -ge 528040) {
          Write-Host ".NET Framework 4.8 Developer Pack installed (Release=$newRelease)."
        } else {
          throw ".NET Framework 4.8 installation completed but registry Release value is $newRelease."
        }
        # Cleanup
        if (Test-Path $installerPath) { Remove-Item $installerPath -Force -ErrorAction SilentlyContinue }

    # Containers run only on Linux. Each chosen one gets the two settings that start it:
    # FM_TestConnectionStrings__<Name>__IsEnabled and __ContainerEnabled.
    - name: Choose database containers
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        # Through the environment, not ${{ }} in the script: the input is free text.
        CONTAINERS: ${{ inputs.containers || 'all' }} # TEMPORARY: see what all containers do before this merges
        # Where Net.IBM.Data.Db2-lnx copies IBM's native client (clidriver) when the tests are built.
        DB2_CLIDRIVER_LIB: ${{ github.workspace }}/test/FluentMigrator.Tests/bin/${{ env.buildConfiguration }}/${{ matrix.dotnet-tfm }}/clidriver/lib
      run: |
        default=(SqlServer2016 Postgres MySql Oracle)
        all=(SqlServer2016 Postgres MySql Oracle Firebird DB2)
        chosen=()
        set -f # A '*' in the input is a typo, not a glob.
        for token in ${CONTAINERS//,/ }; do
          case "${token,,}" in
            default) chosen+=("${default[@]}") ;;
            all) chosen+=("${all[@]}") ;;
            none) ;;
            *)
              match=
              for name in "${all[@]}"; do
                if [ "${name,,}" = "${token,,}" ]; then match=$name; fi
              done
              if [ -z "$match" ]; then
                echo "::error::Unknown database container '$token'. Use ${all[*]}, default, all or none."
                exit 1
              fi
              chosen+=("$match") ;;
          esac
        done
        names=$(printf '%s\n' "${chosen[@]}" | sed '/^$/d' | sort -u)
        for name in $names; do
          echo "FM_TestConnectionStrings__${name}__IsEnabled=true" >> "$GITHUB_ENV"
          echo "FM_TestConnectionStrings__${name}__ContainerEnabled=true" >> "$GITHUB_ENV"
        done
        # IBM's provider loads libdb2.so from clidriver/lib, which the loader doesn't search unless told to.
        if grep -qx DB2 <<< "$names"; then
          echo "LD_LIBRARY_PATH=$DB2_CLIDRIVER_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        fi
        echo "Database containers: $(echo ${names:-none} | sed 's/ /, /g')" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Restore, Build, Test
      run: dotnet test --framework ${{ matrix.dotnet-tfm }} --configuration ${{ env.buildConfiguration }} --verbosity quiet --logger trx --collect:"XPlat Code Coverage" --results-directory "TestResults-${{ matrix.dotnet-tfm }}" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: AOT Smoke Tests
      if: matrix.dotnet-tfm == 'net8.0'
      run: dotnet run --project test/FluentMigrator.Tests.Aot/FluentMigrator.Tests.Aot.csproj --configuration ${{ env.buildConfiguration }} --verbosity quiet

    # Pack triggers .NET package validation (EnablePackageValidation in PackageLibrary.props),
    # which fails the build on breaking public-API changes against PackageValidationBaselineVersion.
    # Windows-only because the libraries multi-target net48, which builds natively there.
    # Version must be >= the baseline, so use the GitVersion-computed package version.
    # Build first, then pack --no-build: the analyzer packs (and is validated) during build via
    # GeneratePackageOnBuild, and --no-build avoids its NU5019 on a subsequent CLI pack.
    - name: Validate package API compatibility
      if: matrix.os == 'windows-latest' && (!cancelled())
      shell: pwsh
      run: |
        dotnet build ${{ env.solution }} --configuration ${{ env.buildConfiguration }} --verbosity minimal -p:Version=${{ steps.gitversion.outputs.majorMinorPatch }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet pack ${{ env.solution }} --configuration ${{ env.buildConfiguration }} --no-build --verbosity minimal -p:Version=${{ steps.gitversion.outputs.majorMinorPatch }}

    # Consume the FluentMigrator.MSBuild package just packed above, the way users do: a fresh project per
    # target framework references it, NuGet auto-imports build/<tfm>/FluentMigrator.MSBuild.targets, and
    # <Migrate> must load from tasks/<tfm>/. Also checks Visual Studio's MSBuild.exe with a net48 consumer.
    # Every release through 8.x would have failed this (MSB4062).
    - name: FluentMigrator.MSBuild package smoke test
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $package = Get-ChildItem src/FluentMigrator.MSBuild/bin/${{ env.buildConfiguration }} -Filter 'FluentMigrator.MSBuild.*.nupkg' |
          Where-Object Name -notlike '*.symbols.nupkg' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $package) { throw 'FluentMigrator.MSBuild nupkg not found; the pack step must run first.' }
        ./test/FluentMigrator.MSBuild.PackageSmoke/Invoke-PackageSmoke.ps1 -PackagePath $package.FullName -FullFramework

    - name: Verify test results coverage files exists
      if: matrix.os == 'ubuntu-latest' && (!cancelled())
      run: |
        echo "=== Runner variable github.workspace ==="
        echo "${{ github.workspace }}"
        echo "=== Environment variable GITHUB_WORKSPACE ==="
        echo $GITHUB_WORKSPACE
        echo "=== Coverage directory listing ==="
        # -iname: the collector writes `coverage.cobertura.xml` (lowercase),
        # so a case-sensitive -name "*Cobertura.xml" never matched on Linux.
        find . -type f -iname "*cobertura.xml" || true

    - name: Combine Coverage Reports
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
      if: '!cancelled()'
      with:
        reports: "**/*.cobertura.xml"
        targetdir: "coveragereport"
        reporttypes: "Cobertura,MarkdownSummaryGithub"
        verbosity: "Info"
        title: "Code Coverage"
        tag: "${{ github.run_number }}_${{ github.run_id }}"
        toolpath: "reportgeneratortool"
    # Needs shell: bash — the default shell on Windows runners is pwsh, where
    # $GITHUB_STEP_SUMMARY is not a variable (it would be $env:GITHUB_STEP_SUMMARY)
    # and the redirect target expands to null.
    - name: Write Coverage Summary to Job Summary
      if: '!cancelled()'
      shell: bash
      run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Combined Coverage XML
      uses: actions/upload-artifact@v7
      if: '!cancelled()'
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.dotnet-tfm }}
        path: coveragereport/Cobertura.xml
        retention-days: 5

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      # Only the Linux leg comments: both matrix legs share one sticky comment
      # id, so without this they race and clobber each other.
      # Fork PRs get a read-only token, so commenting is best-effort.
      continue-on-error: true
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && !cancelled()
      with:
        header: code-coverage
        recreate: true
        path: coveragereport/SummaryGithub.md

    - name: Upload Test Result Files
      uses: actions/upload-artifact@v7
      if: '!cancelled()'
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.dotnet-tfm }}
        # Action inputs are NOT shell-expanded: "$GITHUB_WORKSPACE/..." was
        # matched literally and never found anything. Globs are already
        # relative to the workspace.
        path: "**/TestResults-${{ matrix.dotnet-tfm }}/**/*"
        retention-days: 5

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      # GitHub Actions initially only supported containerized actions, which is not supported on Windows
      # and this particular GitHub action from EnricoMi is a containerized action
      if: matrix.os == 'ubuntu-latest' && (!cancelled())
      # Fork PRs get a read-only token, so publishing the check is best-effort.
      continue-on-error: true
      with:
        # Relative glob, not "$GITHUB_WORKSPACE/..." — see note above.
        files: "**/*.trx"

    - name: Diagnostics (Linux)
      if: matrix.os == 'ubuntu-latest' && failure()
      run: |
        echo "=== dotnet --info ==="
        dotnet --info || true
        echo "=== Repo root listing ==="
        ls -la || true
        echo "=== Check test project obj folder ==="
        TEST_OBJ="test/FluentMigrator.Analyzers.Tests/obj"
        if [ -d "$TEST_OBJ" ]; then
          echo "Found $TEST_OBJ, listing contents (first 1000 chars of each file):"
          find "$TEST_OBJ" -type f -maxdepth 3 -print -exec sh -c 'echo "---- {} ----"; head -c 1000 "{}" || true; echo' \;
        else
          echo "$TEST_OBJ does not exist"
        fi
    - name: Diagnostics (Windows)
      if: matrix.os == 'windows-latest' && failure()
      shell: pwsh
      run: |
        Write-Host "=== dotnet --info ==="
        dotnet --info
        Write-Host "=== Repo root listing ==="
        Get-ChildItem -Force
        $testObj = "test\FluentMigrator.Analyzers.Tests\obj"
        Write-Host "=== Check test project obj folder ($testObj) ==="
        if (Test-Path $testObj) {
          Get-ChildItem -Path $testObj -Recurse -File | ForEach-Object {
            $file = $_.FullName
            Write-Host "---- $file ----"
            try {
              # Output the first 1000 lines
              Get-Content -Path $file -TotalCount 1000
            }
            catch {
              Write-Warning "Unable to read '$file': $($_.Exception.Message)"
            }
            Write-Host ""
          }
        } else {
          Write-Host "$testObj does not exist"
        }
