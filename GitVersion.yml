# GitVersion 7 layout: `calculation` decides the version, `output` formats it.
# Migrated from the GitVersion 6 file with `gitversion config migrate`.
calculation:
  # mode: ContinuousDeployment
  tag-prefix: '[vV]?'
  branches:
    release:
      mode: ContinuousDeployment
    hotfix:
      mode: ContinuousDeployment
  ignore:
    sha: []
output:
  assembly-versioning-scheme: Major
  # AssemblySemFileVer, such as 8.0.2.0. Not assembly-file-versioning-format,
  # which takes a format string such as '{MajorMinorPatch}' and outputs a bare
  # MajorMinorPatch as the literal text.
  assembly-file-versioning-scheme: MajorMinorPatch
